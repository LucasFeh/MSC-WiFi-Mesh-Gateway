<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Topologia da Rede</title>
    <link rel="stylesheet" href="/static/style/styles.css">
    <style>
        body { overflow: hidden; }
        #treesvg { width: 100%; height: calc(100vh - 52px); display: block; }
    </style>
</head>
<body>
    <header>
        <div style="display:flex;align-items:center;gap:12px">
            <a href="/" style="font-size:12px;color:#60a5fa;text-decoration:none;
               background:#1e3a5f;border:1px solid #2563eb55;border-radius:5px;
               padding:4px 10px;">&#8592; Monitor</a>
            <h1>Topologia da Rede</h1>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
            <small>atualizado: <span id="updated">--</span></small>
            <span style="display:inline-flex;align-items:center;gap:4px;font-size:10px;
                  color:#22c55e;background:#16a34a22;border:1px solid #22c55e44;
                  border-radius:99px;padding:2px 8px;">
                <span class="dot dot-on"></span> Live
            </span>
        </div>
    </header>
    <svg id="treesvg"></svg>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="/static/script/mesh_tree.js"></script>
</body>
</html>
